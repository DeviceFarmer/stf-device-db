name: Update device database

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-db

jobs:
  update:
    name: Update device database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      BRANCH: data/update-devices
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet dist/devices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dist/devices.json is up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add dist/devices.json
          # Signed off because the pull request is subject to the DCO check like any other.
          git commit -s -m "Update the device database"
          # Force because the branch is generated: an unmerged update from last month is replaced.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "$GITHUB_REF_NAME" \
              --title "Update the device database" \
              --body "Monthly rebuild of \`dist/devices.json\` from Google Play, LineageOS and Wikidata, created by the [Update device database]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) workflow."
          fi

          # Pushes and pull requests made with GITHUB_TOKEN start no workflows, so CI is
          # dispatched for the branch to report the required checks on its head commit.
          gh workflow run ci.yml --ref "$BRANCH"
